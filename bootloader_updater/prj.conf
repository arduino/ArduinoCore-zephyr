CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_GPIO=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# The updater only needs the hardware UART console and LED status. Do not
# inherit the board's USB CDC ACM serial backend or enable either USB stack.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_DEVICE_STACK_NEXT=n

CONFIG_MAIN_STACK_SIZE=4096

# variant overlays define sleep-only pinctrl states, as the loader enables
# CONFIG_DEVICE_DEINIT_SUPPORT
CONFIG_PINCTRL_KEEP_SLEEP_STATE=y
