# ---------------------------------------------------------------------------
# USB DFU bootloader -- core function
# ---------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano Chandler"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x007e
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_USBD_DFU=y
CONFIG_APP_USB_DFU_USE_FLASH_BACKEND=y
# src/dfu_images.c is an app-local copy of the in-tree flash backend that also
# feeds dfu_activity_notify(); see the comment at the top of that file. Only one
# of the two may register slot0_image/slot1_image.
CONFIG_USBD_DFU_FLASH=n
CONFIG_USBD_DFU_FLASH_SLOT0=n
CONFIG_USBD_DFU_FLASH_SLOT1=n

# ---------------------------------------------------------------------------
# Image placement: this image links at the BFM base (0x08000000) directly --
# see app.overlay.
# ---------------------------------------------------------------------------
# Its vector table is therefore already on the hardware reset address, so
# relocating rom_start there would collide with the image itself.
#
# Per-image override on purpose; do NOT try to hoist it into the SoC
# Kconfig.defconfig, which has `default n if BOOTLOADER_MCUBOOT || MCUBOOT`.
# That default is correct for Microchip's layout, where MCUboot lives in BFM at
# flash0 offset 0 (so it already owns the reset vector) and images under it are
# chainloaded from PFM. This board deviates -- MCUboot sits in PFM and needs
# =y for a BFM stub (see extra/mcuboot/nano_chandler_monica.conf), while this
# sample *is* the BFM resident and needs =n. "Which image owns 0x08000000" is
# genuinely a per-image fact here, so it belongs in each image's own conf.
CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_USE_DT_CODE_PARTITION=n

# Bound the image to ONE Dual-Boot slot, not the whole 128 KB of BFM.
#
# BFM is two 64 KB slots, one per panel, and the Boot ROM maps the one with the
# higher sequence number to 0x08000000 (DS 31.2.17.2). That is what makes the
# probe-less self-update in CONFIG_APP_BFM_DFU_ALT safe against power loss --
# but it only works while the image fits a single slot. An image spanning both
# would overwrite the spare copy it is supposed to fall back on.
#
# This is deliberately enforced by the linker rather than a build-time check:
# overflowing it must fail here, loudly, and not at promotion time on a user's
# board. If it ever does overflow, shrink the image; do not raise this.
CONFIG_FLASH_LOAD_SIZE=0x10000

# ---------------------------------------------------------------------------
# Stack and buffer sizing -- NOT optional. These fix real DFU download
# failures, and they are deliberately sized for the worst case of the debug
# block at the bottom being ENABLED, so turning logging on needs no retuning.
# ---------------------------------------------------------------------------

# The DFU download handler runs on the USB device stack thread, not main:
# dfu_flash_write() -> flash_img_buffered_write() -> stream_flash_erase_to_append()
# -> flash_mchp_erase() -> exec_flash_operation() all nest there, and with
# CONFIG_LOG_MODE_IMMEDIATE every log line adds a blocking formatter frame on top.
# The 1024 B default overflows on the first erase (USAGE FAULT / stack overflow),
# which surfaces to the host as a mid-transfer dfu-util "dfuERROR / errUNKNOWN"
# at a random offset.
CONFIG_USBD_THREAD_STACK_SIZE=4096

# Total memory for ALL UDC request buffers (not per-buffer). The 1024 B default
# holds only two 512 B DFU control transfers, so while the usbd thread is
# blocked in a 4 KB page erase the next transfer's net_buf_alloc_len(K_NO_WAIT)
# fails and that DNLOAD is dropped outright -- the class never sees it, and the
# following block trips the sequence check in dfu_flash_write() ("expected N,
# got N+1"). Sized here for 16 x 512 B in flight.
CONFIG_UDC_BUF_POOL_SIZE=8192

# main() does not bring USB up (that happens in switch_to_dfu_mode(), on the
# system workqueue), so its deepest frame is the LOG_MODE_IMMEDIATE cbprintf
# path -- well under 1 KB. The upstream 32768 was 55% of all RAM this image
# used; 8192 keeps ~8x headroom. Validate with CONFIG_THREAD_ANALYZER if you
# change what main() does.
CONFIG_MAIN_STACK_SIZE=8192

# The workqueue is where switch_to_dfu_mode() actually runs -- usbd_add_descriptor
# /add_configuration/register_class/init/enable, each with blocking IMMEDIATE log
# frames on top. The 1024 B default is the same too-small-for-USB-DFU trap that
# bit USBD_THREAD_STACK_SIZE above; it has not overflowed here, this is headroom.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---------------------------------------------------------------------------
# Debug console and logging -- OPTIONAL, disabled by default.
#
# Uncomment this whole block to get the boot log on sercom6 (header J4,
# TX=PA00/RX=PA01) at 115200. See app.overlay for why sercom6 and not the
# variants' own console.
#
# Two things to know before enabling:
#
#  - Log volume perturbs DFU transfer timing. With LOG_MODE_IMMEDIATE every
#    line is a *blocking* UART write, and usbd_dfu/dfu_flash log per 512 B
#    block (~58 ms each) on the usbd thread, stalling control responses until
#    dfu-util retries a block and trips the silent sequence check
#    `data->last_block + 1U != block` in dfu_flash_write(). That is why the
#    per-module levels below are pinned at WRN rather than left at default.
#    Raise them only to debug, and expect timing to shift when you do.
#  - Historically, *disabling* logging appeared to break DFU downloads. That
#    was the USBD_THREAD_STACK_SIZE / UDC_BUF_POOL_SIZE bugs above being
#    masked by the delay log writes introduced; both are fixed now. Still
#    worth re-running one full `dfu-util` download after flipping this block,
#    since it does change transfer timing.
# ---------------------------------------------------------------------------
#CONFIG_PRINTK=y
#CONFIG_UART_LINE_CTRL=y
#CONFIG_LOG=y
#CONFIG_LOG_BACKEND_UART=y
#CONFIG_LOG_BACKEND_UART_AUTOSTART=y
#CONFIG_LOG_DEFAULT_LEVEL=3
#CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_USBD_LOG_LEVEL_WRN=y
#CONFIG_USBD_DFU_LOG_LEVEL_WRN=y
#CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
#CONFIG_IMG_MANAGER_LOG_LEVEL_WRN=y
#CONFIG_STREAM_FLASH_LOG_LEVEL_WRN=y
# The NVM controller reports failures as per-flag LOG_ERR in
# exec_flash_operation() (WPERR/WRERR/FIFOERR/BUSERR/OPERR/...), plus LOG_WRN
# from fcw_ready_wait() on a busy-poll timeout. INF surfaces all of those, and
# they are rare enough not to perturb transfer timing.
#CONFIG_FLASH_LOG_LEVEL_INF=y
# So a fault report names the thread instead of "unknown".
#CONFIG_THREAD_NAME=y

#override values from zephyr/samples/subsys/usb//common/Kconfig.sample_usbd
CONFIG_SAMPLE_USBD_VID=0x2341
CONFIG_SAMPLE_USBD_PID=0x007e
CONFIG_SAMPLE_USBD_PRODUCT="Arduino Nano Chandler"
CONFIG_SAMPLE_USBD_MANUFACTURER="Arduino"
