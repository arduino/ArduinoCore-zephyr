CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano Chandler"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x007e
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Arduino Nano Chandler"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Arduino"
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# Not for logging option despite the name: 1200 touch
CONFIG_UART_LINE_CTRL=y

# MCUboot is the sole bootloader; no USB DFU interface is needed.
#
# The reboot into serial recovery is triggered by the 1200-bps touch that
# loader/main.c watches for (USBD_MSG_CDC_ACM_LINE_CODING), which lands in
# this variant's variant.c: arm the shared cookie, then reset. MCUboot sees
# the cookie and enters serial recovery.

# NVIC_SystemReset() is used directly in variant.c, but the weak _on_1200_bps()
# fallbacks in the core and loader call sys_reboot(). loader/bfm_update.c also
# reboots into a freshly promoted bootloader.
CONFIG_REBOOT=y

# crc32_ieee_update(), for checking a staged bootloader image before any of BFM
# is overwritten (variants/.../loader/bfm_update.c). Deliberately a CRC and not
# a hash: the loader has no SHA-256 linked, this only has to catch a corrupt
# staging area, and what actually lands in BFM is verified byte-for-byte by
# bfm_program() before the slot is ever promoted.
CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_LLEXT_HEAP_SIZE=64

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

CONFIG_FPU=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_NET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y

# The KSZ8081 link-up callback drives net_if_up on the system workqueue, whose
# 1024 B default overflows a second after the cable is plugged in.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# ETH_MCHP_GMAC_G1 depends on this; without it the driver silently vanishes
# from the build and the board comes up with no network interface.
CONFIG_NET_BUF_FIXED_DATA_SIZE=y

# NET_BUF_DATA_SIZE=128b, so a single 1500 frame costs about a dozen fragments
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96

CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_FILE_SYSTEM=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_SPI_ASYNC=y
CONFIG_I2C_TARGET=y

# Avoid reset address at 0x08000000 - that is BFM, where the bootloader lives
CONFIG_ROMSTART_RELOCATION_ROM=n

# --- Booted by MCUboot (multi-image, upgrade-only, no validation) -------------
#
# The boot chain is MCUboot (BFM 0x08000000) -> this loader (slot0, PFM
# 0x0C000000). BOOTLOADER_MCUBOOT shifts the link address by the image header
# and pulls in the MCUboot image footer. The sketch is a separate image in
# slot2, loaded by this loader — not part of the MCUboot image.
CONFIG_BOOTLOADER_MCUBOOT=y

# The loader IS the MCUboot image — no combined bundle. Zephyr produces a
# headered zephyr.signed.bin at loader-build time. The sketch is uploaded
# separately as raw data to slot2.
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=n

# Multi-image MCUboot: each image is uploaded directly to its primary slot
# via DIRECT_IMAGE_UPLOAD. There is no secondary slot to swap or overwrite
# from (the 4K dummies are always empty). SINGLE_APP tells Zephyr's
# mcuboot.cmake to use slot0's size for imgtool --slot-size, and not to
# require slot1_partition in this overlay.
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# The linker now enforces the 288K limit directly: slot0 IS 288K (no longer
# the 896K combined image). CONFIG_USE_DT_CODE_PARTITION=y derives the size
# from the partition table.
#
# Headroom is not generous. Measured: bare module 250K, Monica 281K of the 288K,
# because Monica carries the WiFi stack as well. Watch this number.

# SET_CONFIGURATION allocates two 512-byte HS bulk buffers for CDC ACM, which
# exhausts the 1024 B default pool and leaves EP0 unable to allocate - the host
# then loops reset -> set address -> reset until it gives up. Same sizing as
# samples/cdc_acm_bridge, where it is likewise not optional.
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_USBD_THREAD_STACK_SIZE=4096

