CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n
# CONFIG_BOOT_RSA_PSA=y
# CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y

CONFIG_BOOT_USB_DFU=y
CONFIG_BOOT_USB_DFU_BOOT_MODE=y
CONFIG_BOOT_USB_DFU_VID=0x2341
CONFIG_BOOT_USB_DFU_PID=0x017B
CONFIG_BOOT_USB_DFU_MANUFACTURER_STRING="Arduino"
CONFIG_BOOT_USB_DFU_PRODUCT_STRING="Mezza DFU Recovery"
CONFIG_BOOT_USB_DFU_ERASE_TRAILING_AREA=n

CONFIG_MCUBOOT_INDICATION_LED_BLINK_FADING=y

# Enable the following parameter to see mcuboot logs
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
