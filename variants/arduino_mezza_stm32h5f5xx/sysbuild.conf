SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${ZEPHYR_BASE}/../bootloader/mcuboot/root-ec-p256.pem"

# Enable those parameters to have watchdog started by MCUBoot and
# Watchdog feed by loader thread
SB_CONFIG_ENFORCE_SECURE_WATCHDOG=n
SB_CONFIG_SECURE_WATCHDOG_TIMEOUT_MS=20000
