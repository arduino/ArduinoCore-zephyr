#
# MCUboot in BFM + this loader, built together by extra/build.sh.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# Images carry a SHA-256 only: every machine compiling sketches would need the
# private key, so a signature could not keep anyone out.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# To sign with ECDSA-P256 instead, generate a key (imgtool keygen -k <key>.pem
# -t ecdsa-p256), keep it out of the repository, enable these two lines and the
# matching ones in mcuboot.conf, and add --pem_file to boards.txt's squash args.
#SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
#SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="/path/to/<key>.pem"

# The PIC32CK WDT tops out at 16384 ms (wdt_mchp_g1 rejects anything longer).
SB_CONFIG_SECURE_WATCHDOG_TIMEOUT_MS=16000

# Double tap, DFU entrance/exit and the BFM DFU alternate.
SB_CONFIG_ARDUINO_MCUBOOT_HOOKS=y
