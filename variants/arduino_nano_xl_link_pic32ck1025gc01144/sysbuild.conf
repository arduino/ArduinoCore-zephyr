# MCUboot in BFM + this loader, built together by extra/build.sh.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# 🔴 Development key (MCUboot's root-ec-p256.pem): anyone can sign for it.
# Replace with a private key before shipping; keep boards.txt's --pem_file in step.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${ZEPHYR_BASE}/../core/variants/arduino_nano_xl_link_pic32ck1025gc01144/root-ec-p256.pem"

# The PIC32CK WDT tops out at 16384 ms (wdt_mchp_g1 rejects anything longer).
SB_CONFIG_SECURE_WATCHDOG_TIMEOUT_MS=16000

# Breathing LED, PFSWAP fix-up, double tap and the BFM DFU alternate.
SB_CONFIG_ARDUINO_MCUBOOT_HOOKS=y
