#
# MCUboot in BFM, USB DFU recovery. Pairs with mcuboot.overlay; both reach the
# MCUboot image through loader/sysbuild.cmake.
#
# 🔴 Must fit ONE 64K BFM Dual-Boot slot. Check the linker's FLASH line on
# every rebuild; nothing else will tell you.

# --- Image: loader + sketch squashed into one image, checked by SHA-256 only
# (the signature type comes from sysbuild.conf). For ECDSA-P256 signing enable
# these; tinycrypt is the only P256 backend that fits the slot.
#CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
#CONFIG_BOOT_ECDSA_TINYCRYPT=y

# --- Placement: wholly in BFM, no relocation stub needed.
CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_USE_DT_CODE_PARTITION=y

# --- Single image, overwrite-only: DFU stages into slot1, MCUboot copies it
# over slot0. No swap, no rollback.
CONFIG_UPDATEABLE_IMAGE_NUMBER=1
CONFIG_BOOT_UPGRADE_ONLY=y

# Each 1 MB PFM slot contains 256 erase sectors of 4 KB. MCUboot's auto
# detection only recognises soc-nv-flash, whereas these banks use
# microchip,flash-g3, so it falls back to 128 (enough only for the old 512 KB slots).
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# --- Recovery: upstream device_next USB DFU, alt 0 = slot1, alt 1 = BFM
# (boot/arduino/hooks/bfm/bfm_dfu.c). slot0 must not be exposed: writing it
# directly would bypass the staging copy.
CONFIG_BOOT_USB_DFU=y
CONFIG_USBD_DFU_FLASH_SLOT0=n
CONFIG_USBD_DFU_FLASH_SLOT1=y
CONFIG_USBD_DFU_NUMOF_IMAGES=2
CONFIG_USBD_DFU_TRANSFER_SIZE=512
CONFIG_USBD_DFU_ENABLE_UPLOAD=n
CONFIG_BOOT_USB_DFU_ERASE_TRAILING_AREA=y
# No CDC-ACM in the bootloader: the 1200-bps touch is handled by the loader.
CONFIG_USBD_CDC_ACM_CLASS=n

# Recovery PID — distinct from the loader's runtime PID so arduino-cli sees a new port.
CONFIG_BOOT_USB_DFU_VID=0x2341
CONFIG_BOOT_USB_DFU_PID=0x018e
CONFIG_BOOT_USB_DFU_MANUFACTURER_STRING="Arduino"
CONFIG_BOOT_USB_DFU_PRODUCT_STRING="Nano XL Link bootloader"

# --- Entrance: double-tap reset OR 1200-bps touch, both through the retention
# boot mode (boot/arduino/hooks/hooks.c). DFU then waits forever.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# Double tap arms before clock bring-up (hundreds of ms on this SoC).
CONFIG_RETAINED_MEM_INIT_PRIORITY=0
CONFIG_BOOT_USB_DFU_BOOT_MODE=y
# Fallback if hooks.c cannot re-enter through the boot mode: without it an
# invalid slot0 ends in FIH_PANIC with no USB.
CONFIG_BOOT_USB_DFU_NO_APPLICATION=y

# --- Watchdog: enabled by sysbuild (SB_CONFIG_ENFORCE_SECURE_WATCHDOG). The
# boot-mode entrance never starts it, so recovery can wait indefinitely.
CONFIG_BOOT_USB_DFU_AVOID_WATCHDOG=y

# --- Hooks module (boot/arduino/hooks): DFU entrance and exit.
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_BOOT_GO_HOOKS=y

# LED on while waiting in USB DFU.
CONFIG_MCUBOOT_INDICATION_LED=y

# --- Console: off, there is no UART left for it.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# No console → logging is dead weight.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# --- Trim: bootloader doesn't need these Zephyr defaults.
CONFIG_ARM_MPU=n
# No GPIO interrupts in this image.
CONFIG_INTC_MCHP_EIC_G1=n

# SERCOM UART dropped via overlay (promptless Kconfig follows DT).
# Fault dump has nowhere to go without console; read PC over SWD.
CONFIG_FAULT_DUMP=0

CONFIG_PRINTK=n

# --- Stacks -------------------------------------------------------------------
#
# Empirical minimums for the PIC32CK UDC driver + DFU traffic.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_USBD_THREAD_STACK_SIZE=4096
