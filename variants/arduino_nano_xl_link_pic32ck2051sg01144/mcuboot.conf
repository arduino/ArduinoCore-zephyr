# MCUboot in the whole 128K BFM (Single Boot), updated over SWD only.

# Loader + sketch in one ECDSA-P256 signed image; tinycrypt is the smallest backend.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y

CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_USE_DT_CODE_PARTITION=y

# Overwrite-only: DFU stages into slot1, MCUboot copies it over slot0.
CONFIG_UPDATEABLE_IMAGE_NUMBER=1
CONFIG_BOOT_UPGRADE_ONLY=y

# 1 MB slots of 4 KB sectors; auto-detection misses microchip,flash-g3.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# USB DFU, alt 0 = slot1 only.
CONFIG_BOOT_USB_DFU=y
CONFIG_USBD_DFU_FLASH_SLOT0=n
CONFIG_USBD_DFU_FLASH_SLOT1=y
CONFIG_USBD_DFU_NUMOF_IMAGES=1
CONFIG_USBD_DFU_TRANSFER_SIZE=512
CONFIG_USBD_DFU_ENABLE_UPLOAD=n
CONFIG_BOOT_USB_DFU_ERASE_TRAILING_AREA=y
CONFIG_USBD_CDC_ACM_CLASS=n

CONFIG_BOOT_USB_DFU_VID=0x2341
CONFIG_BOOT_USB_DFU_PID=0x018e
CONFIG_BOOT_USB_DFU_MANUFACTURER_STRING="Arduino"
CONFIG_BOOT_USB_DFU_PRODUCT_STRING="Nano XL Link bootloader"

# DFU entrance: 1200-bps touch or double tap (zephyr board double-tap.c),
# both through the retention boot mode.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# Double tap arms before clock bring-up (hundreds of ms on this SoC).
CONFIG_RETAINED_MEM_INIT_PRIORITY=0
CONFIG_BOOT_USB_DFU_BOOT_MODE=y
# Fade LED_BUILTIN (mcuboot-fade-led0) while waiting in USB DFU.
CONFIG_MCUBOOT_INDICATION_LED_BLINK_FADING=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

CONFIG_PRINTK=n
CONFIG_FAULT_DUMP=0
CONFIG_ARM_MPU=n
CONFIG_INTC_MCHP_EIC_G1=n

# Empirical minimums for the UDC driver + DFU traffic.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_USBD_THREAD_STACK_SIZE=4096
