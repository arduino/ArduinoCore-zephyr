# USB identity of the carrier (bare module is 0x007e / "Arduino Nano XL Link").
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano XL Link Connector"
CONFIG_USB_DEVICE_PID=0x008e

# DNS comes from the ESP-AT module, not the bare module's static resolver.
CONFIG_DNS_RESOLVER=n
CONFIG_DNS_SERVER_IP_ADDRESSES=n

# ESP8266 AT module on sercom1 (shield overlay; AT version in its Kconfig.defconfig).
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
CONFIG_WIFI_ESP_AT_PASSIVE_MODE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# +IPD with the peer address, else UDP recvfrom() fails with ENOTSUP. Defaults
# to y only with DNS_RESOLVER, which is off here.
CONFIG_WIFI_ESP_AT_CIPDINFO_USE=y
