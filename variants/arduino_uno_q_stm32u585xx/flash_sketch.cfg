reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
if {$::tcl_platform(platform) eq "windows"} {
	set null_device NUL
} else {
	set null_device /dev/null
}
init
reset init
flash info 0
log_output $null_device
if {[catch {flash verify_image ${filename0}}] != 0} {
	log_output default
	flash write_image erase ${filename0}
}
log_output $null_device
if {[catch {flash verify_image ${filename1} 0x8100000 bin}] != 0} {
	log_output default
	flash write_image erase ${filename1} 0x8100000 bin
}
log_output default
# Keep the firmware DWT/MON_EN setup and clear DHCSR.C_DEBUGEN left set by
# OpenOCD, so DWT null pointer hits raise DebugMonitor instead of halting.
reset halt
resume
sleep 100
mww 0x40036400 0xCAFFEEEE
mww 0xE000EDF0 0xA05F0000
shutdown
