# CI/dev only target running sketches on the host.

CONFIG_PICOLIBC=y
CONFIG_LLEXT_HEAP_SIZE=256
# the "rest of SRAM" arena (-1) is not mapped memory on the host
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
# printk already goes to stdout through the posix arch console
# (selected by the board); Serial still uses uart0 on stdout
CONFIG_UART_CONSOLE=n
# analogRead on the emulated ADC
CONFIG_ADC=y
CONFIG_ADC_EMUL=y
# Wire and SPI on emulated buses and chips
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_SPI_EMUL=y
# (without the emulator registration messages at each start)
CONFIG_EMUL_LOG_LEVEL_WRN=y
CONFIG_I2C_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
