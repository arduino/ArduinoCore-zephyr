# The board's USB-C connector is wired to the onboard SAMD11 debug
# probe; the console (and the Arduino 'Serial' object) is uart20,
# bridged to the host by the SAMD11 CDC port. No USB device stack is
# used on the nRF54 side.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Link the loader into the chosen code partition (the mapped partition at
# 0x0 replacing the SoC default MCUboot layout). The upstream board's
# cpuapp defconfig omits this, unlike its cpuflpr one; without it the
# loader falls back to the whole-flash size computation, which does not
# exist on nRF54 (no flash0 label).
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_ADC=y
CONFIG_PWM=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LLEXT_HEAP_SIZE=128
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_FPU=y

CONFIG_STACK_USAGE=n
CONFIG_STACK_SENTINEL=n
CONFIG_STACK_CANARIES=n

# Note: the BT controller is not enabled in the initial variant. The
# software LL controller enablement symbol in this Zephyr version is
# BT_LL_SW_SPLIT (the old BT_CTLR symbol no longer exists). On nRF52 it
# is auto-selected because the SoC dtsi sets the bt-hci-ll-sw-split node
# status to "okay"; the nRF54L SoC dtsi defines the same node but leaves
# it "disabled" (Nordic's supported controller for nRF54L is the NCS
# SoftDevice Controller). Forcing BT_LL_SW_SPLIT=y compiles and links,
# but the image faults in a pre-kernel init stage on this hardware.
# Same core-level BLE status as the other Nordic boards, stated in the PR.
