CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_MAX_CONN=4
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_PERIODIC=y
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="RAKwireless RAK4631"
CONFIG_USB_DEVICE_MANUFACTURER="RAKwireless"
# pid.codes test VID/PID; MCUboot enumerates as 0x0004
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x0003
CONFIG_USB_CONFIGURATION_STRING_DESC_ENABLE=n

CONFIG_USBD_CDC_ACM_CLASS=y
# The loader brings USB up itself, once it knows whether this is a debug boot.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

# Keep optimizing for size.
CONFIG_SIZE_OPTIMIZATIONS=y

# Boot mode (rak4631_nrf52840_bootmode.dtsi): the 1200 bps touch in
# variant.cpp (sketch) or loader/main.c (no sketch, debug shell) asks
# MCUboot for serial recovery through it.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
# sys_reboot() after the loader's 1200 bps touch
CONFIG_REBOOT=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_COUNTER=y

CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_AS923=y
CONFIG_LORAWAN_REGION_AU915=y
CONFIG_LORAWAN_REGION_CN470=y
CONFIG_LORAWAN_REGION_EU433=y
CONFIG_LORAWAN_REGION_EU868=y
CONFIG_LORAWAN_REGION_KR920=y
CONFIG_LORAWAN_REGION_IN865=y
CONFIG_LORAWAN_REGION_US915=y
CONFIG_LORAWAN_REGION_RU864=y
CONFIG_LORAWAN_SERVICES=n
CONFIG_LORAWAN_NVM_SETTINGS=y

# NVS required to store LoRaWAN DevNonce
# as per LoRaWAN 1.0.4/1.1 Specifications.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Link the firmware image into zephyr,code-partition,
# instead of assuming it owns the whole flash device.
CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_LLEXT_HEAP_SIZE=128
CONFIG_MAIN_STACK_SIZE=16384

CONFIG_FPU=y

CONFIG_STACK_USAGE=n
CONFIG_STACK_SENTINEL=n
CONFIG_STACK_CANARIES=n

# The board defconfig enables HW_STACK_PROTECTION, but the loader
# disables ARM_MPU (prj.conf), making it unsatisfiable.
CONFIG_HW_STACK_PROTECTION=n

# Logging
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_LOG_DEFAULT_LEVEL=2
