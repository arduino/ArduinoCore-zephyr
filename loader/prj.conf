#
# This file contains selected Kconfig options for the application.

CONFIG_USERSPACE=n
CONFIG_ARM_MPU=n

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1

CONFIG_ARDUINO_API=y

CONFIG_LLEXT=y
CONFIG_LLEXT_LOG_LEVEL_ERR=y
CONFIG_LLEXT_HEAP_SIZE=32
CONFIG_LLEXT_STORAGE_WRITABLE=n
CONFIG_LLEXT_EXPORT_DEVICES=y
CONFIG_LLEXT_RODATA_NO_RELOC=y

CONFIG_LLEXT_EDK=y
CONFIG_LLEXT_EDK_FORMAT_TAR_ZSTD=y

CONFIG_GPIO=y
CONFIG_GPIO_GET_DIRECTION=y
CONFIG_PINCTRL=y
CONFIG_DEVICE_DEINIT_SUPPORT=y
CONFIG_I2C=y
CONFIG_SPI=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_THREAD_PRIORITY=14

CONFIG_EVENTS=y

CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y
CONFIG_RTC_CALIBRATION=y


CONFIG_DEVICE_DEPS=y

CONFIG_USB_CONFIGURATION_STRING_DESC_ENABLE=y
