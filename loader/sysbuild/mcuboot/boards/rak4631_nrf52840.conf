CONFIG_BOOT_SERIAL_UART=n
CONFIG_BOOT_SERIAL_CDC_ACM=y

CONFIG_WARN_DEPRECATED=n

# No console on the board's CDC-ACM port (disabled in the overlay).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# USB identity of the bootloader; a different PID from the loader (0x0003).
CONFIG_BOOT_SERIAL_CDC_ACM_PRODUCT_STRING="RAKwireless RAK4631"
CONFIG_BOOT_SERIAL_CDC_ACM_MANUFACTURER_STRING="RAKwireless"
CONFIG_BOOT_SERIAL_CDC_ACM_VID=0x1209
CONFIG_BOOT_SERIAL_CDC_ACM_PID=0x0004
