# Enable MCUboot bootloader support
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Use your own key at your production code!
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${APP_DIR}/../key/arduino_key_ecdsa-p256.pem"
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Serial recovery writes the loader straight into slot0
# and the sketch straight into slot1; no swap ever runs.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
