# Sysbuild always passes CONFIG_MCUBOOT_UPDATE_FOOTER_SIZE to the loader;
# the symbol only exists with the image manager (library only, no mcumgr).
# Enable flash operations for footer.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

CONFIG_BOOTLOADER_MCUBOOT=y
