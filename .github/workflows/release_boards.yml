# Generic Infineon release workflow: triggered manually, or by pushing a
# semver tag. Bumps the version (when not already tagged), tags the commit,
# and publishes one release package per board release group (as declared by
# <board>.build.release_group in boards.txt), reusing this single workflow
# instead of one workflow per board/group.
#
# Releases are only allowed from family branches (RELEASE_BRANCHES below):
# workflow_dispatch must be run on one of them, and a pushed tag must point
# to a commit reachable from one of them.
#
# Requires a successful "Package, test and upload core" run for the released
# commit, whose artifacts are reused (nothing is rebuilt here).
#
# A release group is only published if both of these exist:
#   - at least one board with build.release_group=<group> in boards.txt
#   - a matching package/package_infineon_<group>_index.template.json

name: Release boards

on:
  workflow_dispatch: {}
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:

  discover-release-groups:
    name: Discover release groups
    runs-on: ubuntu-latest
    if: ${{ endsWith(github.repository, '/ArduinoCore-zephyr') }}
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    permissions:
      contents: read
    env:
      RELEASE_BRANCHES: edge-main control-main
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release is from an allowed family branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH="${{ github.ref_name }}"
            for b in $RELEASE_BRANCHES; do
              [ "$BRANCH" == "$b" ] && { echo "Dispatched from allowed branch: $BRANCH"; exit 0; }
            done
            echo "::error::Releases can only be dispatched from: $RELEASE_BRANCHES (got '$BRANCH')"
            exit 1
          fi

          # tag push: the tagged commit must be reachable from an allowed branch
          git fetch origin $RELEASE_BRANCHES
          for b in $RELEASE_BRANCHES; do
            if git merge-base --is-ancestor "${{ github.sha }}" "origin/$b"; then
              echo "Tag ${{ github.ref_name }} (${{ github.sha }}) is on $b"
              exit 0
            fi
          done
          echo "::error::Tag ${{ github.ref_name }} (${{ github.sha }}) is not reachable from: $RELEASE_BRANCHES"
          exit 1

      - name: Discover release groups with a matching package template
        id: groups
        run: |
          BOARD_GROUPS=$(extra/get_board_details.sh | jq -c '[.[] | select(.release_group != "") | .release_group] | unique')
          TEMPLATE_GROUPS=$(basename -a package/package_infineon_*_index.template.json 2>/dev/null \
            | sed -e 's/^package_infineon_//' -e 's/_index\.template\.json$//' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          GROUPS=$(jq -c -n --argjson boards "$BOARD_GROUPS" --argjson templates "$TEMPLATE_GROUPS" \
            '[$boards[] | select(. as $g | $templates | index($g))]')
          echo "groups=${GROUPS}" >> "$GITHUB_OUTPUT"
          echo "Discovered release groups: ${GROUPS}"

  resolve-release:
    name: Resolve release tag and build run
    runs-on: ubuntu-latest
    needs:
      - discover-release-groups
    if: ${{ needs.discover-release-groups.outputs.groups != '[]' }}
    permissions:
      contents: write
      actions: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      build_run_id: ${{ steps.build_run.outputs.build_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release tag
        id: release_tag
        env:
          RELEASE_BUMP: patch
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags

          EXISTING_TAG=$(git tag --points-at "${{ github.sha }}" --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "${EXISTING_TAG}" ]; then
            echo "Using existing tag on HEAD: ${EXISTING_TAG}"
            echo "release_tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "${LAST_TAG}" ]; then
            LAST_TAG="0.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG}"
          case "${RELEASE_BUMP}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            *)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "release_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release (and tag if missing)
        env:
          TAG: ${{ steps.release_tag.outputs.release_tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --target "${{ github.sha }}" \
              --title "ArduinoCore-zephyr ${TAG}" \
              --notes "Release for ${{ github.sha }}."
          fi

      - name: Find successful package build for this commit
        id: build_run
        run: |
          RUN_ID=$(gh run list --workflow "package_core.yml" --json databaseId,headSha,conclusion,createdAt \
            --jq "[.[] | select(.headSha == \"${{ github.sha }}\" and .conclusion == \"success\")] | sort_by(.createdAt) | last | .databaseId")
          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" == "null" ]; then
            echo "::error::No successful 'Package, test and upload core' run found for commit ${{ github.sha }}. Push/re-run it before releasing." >&2
            exit 1
          fi
          echo "build_run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

  publish-release-group:
    name: Publish ${{ matrix.release_group }} release assets
    runs-on: ubuntu-latest
    needs:
      - discover-release-groups
      - resolve-release
    if: ${{ needs.resolve-release.result == 'success' }}
    strategy:
      matrix:
        release_group: ${{ fromJSON(needs.discover-release-groups.outputs.groups) }}
      fail-fast: false
      # Serialize uploads to avoid concurrent asset uploads to the same release.
      max-parallel: 1
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve-release.outputs.release_tag }}
      RELEASE_GROUP: ${{ matrix.release_group }}
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - name: Determine core artifact for this release group
        id: artifact
        run: |
          ARTIFACT=$(extra/get_board_details.sh | jq -r --arg g "${RELEASE_GROUP}" '[.[] | select(.release_group == $g)][0].artifact')
          if [ -z "${ARTIFACT}" ] || [ "${ARTIFACT}" == "null" ]; then
            echo "No board found for release group '${RELEASE_GROUP}'" >&2
            exit 1
          fi
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Download ${{ env.ARTIFACT }} artifact from the resolved build run
        uses: actions/download-artifact@v8
        with:
          pattern: ArduinoCore-${{ env.ARTIFACT }}-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ needs.resolve-release.outputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release-group archive
        run: |
          if [ -z "${TAG}" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          TAR_FILE=$(find release-assets -maxdepth 1 -name "ArduinoCore-${ARTIFACT}-*.tar.bz2" -print -quit)
          if [ -z "${TAR_FILE}" ]; then
            echo "Downloaded artifact does not contain expected tarball" >&2
            exit 1
          fi

          TAR_BASENAME="ArduinoCore-zephyr_${RELEASE_GROUP}-${TAG}.tar.bz2"
          ./extra/package_release_group.sh "${RELEASE_GROUP}" "${TAR_FILE}" "release-assets/${TAR_BASENAME}"
          rm -f "${TAR_FILE}"
          echo "TAR_BASENAME=${TAR_BASENAME}" >> "$GITHUB_ENV"

      - name: Generate package index JSON
        run: |
          ARTIFACT_PATH="release-assets/${TAR_BASENAME}"
          SIZE=$(wc -c < "${ARTIFACT_PATH}")
          SHA256=$(sha256sum "${ARTIFACT_PATH}" | cut -d' ' -f1)
          URL="https://github.com/${GH_REPO}/releases/download/${TAG}/${TAR_BASENAME}"
          TEMPLATE="package/package_infineon_${RELEASE_GROUP}_index.template.json"

          python3 - <<EOF
          import json

          with open("${TEMPLATE}") as f:
              idx = json.load(f)

          p = idx["packages"][0]["platforms"][0]
          p["version"] = "${TAG}"
          p["archiveFileName"] = "${TAR_BASENAME}"
          p["url"] = "${URL}"
          p["checksum"] = "SHA-256:${SHA256}"
          p["size"] = "${SIZE}"

          with open("release-assets/package_infineon_${RELEASE_GROUP}_index.json", "w") as f:
              json.dump(idx, f, indent=2)
          EOF

      - name: Create or update GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ArduinoCore-zephyr ${{ env.TAG }}
          overwrite_files: true
          files: |
            release-assets/${{ env.TAR_BASENAME }}
            release-assets/package_infineon_${{ env.RELEASE_GROUP }}_index.json
