name: Build and Push Docker Image

env:
  IMAGE_NAME: loader-builder
  REGISTRY: ghcr.io

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      registry:
        required: false
        type: string
      build_args:
        required: false
        type: string
      tag:
        required: false
        type: string
    outputs:
      output_image:
        description: "the docker image complete name"
        value: ${{ jobs.build.outputs.output_image }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      output_image: "${{ steps.image_name.outputs.output_image }}"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - id: image_name
        name: Docker imager complete name
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-')
          echo "output_image=${tag}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ inputs.build_args }}
