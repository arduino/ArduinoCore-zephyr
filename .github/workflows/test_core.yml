# Reusable CI workflow to test the ArduinoCore-zephyr core packages.
#
# When called from package_core.yml, the core packages built in the same run
# are tested. Other callers (e.g. periodic test runs) test the commit they run
# on, using the core packages published for that same commit by a push run of
# package_core.yml (official repository only).
#
# The calling job must grant 'contents: read' permission, and also 'actions:
# read' if the core packages are held by another workflow run.

name: Test core

on:
  workflow_call:
    inputs:
      core-run-id:
        description: >
          ID of the workflow run holding the core packages to test. If empty,
          the core packages published for this commit are used.
        type: string
        default: ''
      core-version:
        description: >
          Version of the core being tested. If empty, it is computed again
          from the current commit.
        type: string
        default: ''
      min-attempt:
        description: >
          First run attempt whose job markers are valid: tests that already
          passed since then are not run again. If empty, the current attempt
          is used, so that only this attempt's results count.
        type: string
        default: ''

env:
  # use the head SHA for PR hashes, instead of the merge commit
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.ref }}
  # location of the published core packages, see publish-core in package_core.yml
  PUBLISHED_CORE_URL: https://downloads.arduino.cc/cores/zephyr

jobs:



  # Compute the core build metadata, locate the core packages to test and
  # download the test data once for all boards.

  prepare:
    name: Prepare tests
    runs-on: ubuntu-latest
    outputs:
      CORE_HASH: ${{ env.CORE_HASH }}
      CORE_VER: ${{ env.CORE_VER }}
      CORE_BRANCH: ${{ env.CORE_BRANCH }}
      ALL_BOARD_FQBNS: ${{ env.ALL_BOARD_FQBNS }}
      # ALL_BOARD_FQBNS entries whose core package is available
      TEST_FQBNS: ${{ env.TEST_FQBNS }}
      CI_BUILDS_URL: ${{ env.CI_BUILDS_URL }}
      # ID of the workflow run holding the core packages, empty if published
      CORE_RUN_ID: ${{ env.CORE_RUN_ID }}
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true # needed for get_core_version.sh

      - name: Identify core version and board set
        env:
          PINNED_CORE_VERSION: ${{ inputs.core-version }}
        run: |
          extra/ci_get_build_info.sh $HEAD_REF

      - name: Find core packages
        env:
          CORE_RUN_ID: ${{ inputs.core-run-id }}
        run: |
          if [ -z "$CORE_RUN_ID" ]; then
            # test the published core packages for this commit (see publish-core
            # in package_core.yml): they cannot change during this run, so mark
            # each available one as completed, for ci_filter_matrix.sh -x
            mkdir -p prereqs-ext
            for ARTIFACT in $(jq -r '.[] | select(. != "zephyr")' <<< "$ARTIFACTS"); do
              if wget -q --method=HEAD "$PUBLISHED_CORE_URL/ArduinoCore-$ARTIFACT-$CORE_HASH.tar.bz2" >& /dev/null ; then
                jq -n --arg id "package-$ARTIFACT" '{ id: $id, status: "success" }' > prereqs-ext/package-$ARTIFACT.json
              fi
            done
            if [ -z "$(ls prereqs-ext/)" ]; then
              echo "::error::No published core packages found for $CORE_HASH"
              exit 1
            fi
            echo "::notice::Testing core packages published at $PUBLISHED_CORE_URL"
          fi
          echo "CORE_RUN_ID=$CORE_RUN_ID" >> "$GITHUB_ENV"

      # package markers of the run holding the core packages; those of another
      # run cannot change during this one
      - uses: actions/download-artifact@v8
        if: ${{ env.CORE_RUN_ID != '' }}
        continue-on-error: true # nothing to download if all packages failed
        with:
          path: ${{ env.CORE_RUN_ID != github.run_id && 'prereqs-ext/' || 'prereqs/' }}
          pattern: prereq-package-*
          merge-multiple: true
          run-id: ${{ env.CORE_RUN_ID }}
          # a token is only needed to access artifacts of other runs
          github-token: ${{ env.CORE_RUN_ID != github.run_id && github.token || '' }}

      # test markers of earlier attempts of this run
      - uses: actions/download-artifact@v8
        continue-on-error: true # nothing to download on the first attempt
        with:
          path: prereqs/
          pattern: prereq-test-*
          merge-multiple: true

      - name: Select tests
        env:
          MIN_ATTEMPT: ${{ inputs.min-attempt || github.run_attempt }}
        run: |
          # only test boards whose core package was successfully created,
          # and that did not already pass in an earlier attempt
          echo "TEST_FQBNS=$(extra/ci_filter_matrix.sh -m $MIN_ATTEMPT -x prereqs-ext/ prereqs/ "$ALL_BOARD_FQBNS")" >> "$GITHUB_ENV"

      - name: Download test data
        run: |
          extra/ci_fetch_tests.sh

      - name: Archive test data
        uses: actions/upload-artifact@v7
        with:
          name: test-data
          path: test-data/
          overwrite: true
          retention-days: 1



  # For each board and link mode, compile all test sketches using the core
  # packages. The compilation reports are archived for later inspection.
  # Each job fails as soon as its own results include unexpected errors, to
  # give early feedback; the overall verdict is still given by verify-core.

  test-core:
    name: ${{ matrix.board }}:${{ matrix.link_mode }}
    runs-on: ubuntu-latest
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.TEST_FQBNS != '[]' }}
    strategy:
      matrix:
        include:
          ${{ fromJSON( needs.prepare.outputs.TEST_FQBNS ) }}
      fail-fast: false
    env:
      PLAT: arduino:${{ matrix.subarch }}
      FQBN: arduino:${{ matrix.subarch }}:${{ matrix.board }}:link_mode=${{ matrix.link_mode }}
      CORE_ARTIFACT: ArduinoCore-${{ matrix.artifact }}-${{ needs.prepare.outputs.CORE_HASH }}.tar.bz2
      ARTIFACT_TAG: ${{ needs.prepare.outputs.CORE_HASH }}-${{ matrix.board }}-${{ matrix.link_mode }}
      CI_BUILDS_URL: ${{ needs.prepare.outputs.CI_BUILDS_URL }}
    steps:

      # only needs the test list generator and artifact information
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github/actions/mark-job-completed/
            extra/ci_apply_tests.sh
            extra/ci_check_test_report.py
            extra/ci_shared.py
            extra/artifacts/
            variants/*/test_setup.sh
            variants/*/known_example_issues.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        if: ${{ needs.prepare.outputs.CORE_RUN_ID != '' }}
        with:
          name: ${{ env.CORE_ARTIFACT }}
          run-id: ${{ needs.prepare.outputs.CORE_RUN_ID }}
          # a token is only needed to access artifacts of other runs
          github-token: ${{ needs.prepare.outputs.CORE_RUN_ID != github.run_id && github.token || '' }}

      - uses: actions/download-artifact@v8
        with:
          name: test-data
          path: test-data/

      - name: Set up core
        env:
          CORE_RUN_ID: ${{ needs.prepare.outputs.CORE_RUN_ID }}
        run: |
          if [ -z "$CORE_RUN_ID" ]; then
            wget -q "$PUBLISHED_CORE_URL/$CORE_ARTIFACT"
          fi
          tar xf ${CORE_ARTIFACT} # will create ArduinoCore-zephyr/
          echo "REPORT_FILE=$(echo ${FQBN} | tr ':' '-').json" >> $GITHUB_ENV

      - name: Get test sketches
        run: |
          # sets ALL_TESTS and ALL_LIBRARIES env vars in GITHUB_ENV
          extra/ci_apply_tests.sh ${{ matrix.artifact }} ${{ matrix.variant }}

      - name: Compile tests for ${{ matrix.board }}
        uses: pillo79/compile-sketches@next
        with:
          # Use ci-builds core, if possible, to use the exact set of tools required by the source
          fqbn: ${{ env.FQBN }}
          platforms: |
            # Use Board Manager version first to install the tools
            - name: ${{ env.PLAT }}
              ${{ env.CI_BUILDS_URL != '' && format('source-url: {0}', env.CI_BUILDS_URL) || '' }}
            # ... then replace that with the local version
            - name: ${{ env.PLAT }}
              source-path: "ArduinoCore-zephyr"
          sketch-paths: |
            ${{ env.ALL_TESTS }}
          libraries: |
            ${{ env.ALL_LIBRARIES }}
          cli-compile-flags: |
            - '--build-property'
            - 'compiler.c.extra_flags=-Wno-type-limits -Wno-missing-field-initializers'
            - '--build-property'
            - 'compiler.cpp.extra_flags=-Wno-type-limits -Wno-missing-field-initializers'
          verbose: 'false'
          enable-deltas-report: 'false'
          enable-issues-report: 'true'
          always-succeed: 'true'

      - name: Prepare log
        if: ${{ success() || failure() }}
        run: |
          # make sure to create an empty report if none was created
          [ ! -f sketches-reports/${REPORT_FILE} ] && mkdir -p sketches-reports && echo "{}" > sketches-reports/${REPORT_FILE}
          # remove base path of the core install from all file references to make logs cleaner
          sed -i -e 's!/home/runner/.arduino15/packages/arduino/hardware/zephyr/[^/]*/!!g' sketches-reports/${REPORT_FILE}

      # archive the compile report for later
      - uses: actions/upload-artifact@v7
        if: ${{ success() || failure() }}
        with:
          name: test-report-${{ env.ARTIFACT_TAG }}
          path: sketches-reports/*
          overwrite: true
          retention-days: 1

      # compilation errors do not fail the step above, check them against the
      # known issues of this variant to fail the job early on unexpected errors
      - name: Check test results
        if: ${{ success() || failure() }}
        run: |
          extra/ci_check_test_report.py ${{ matrix.variant }} sketches-reports/${REPORT_FILE}

      # publish the outcome of this job, with its log link, for the CI summary
      - name: Mark test as completed
        if: ${{ !cancelled() }}
        uses: ./.github/actions/mark-job-completed
        with:
          id: ${{ matrix.id }}
          retention-days: 1
