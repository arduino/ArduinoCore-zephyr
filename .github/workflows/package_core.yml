# CI workflow to build, package, test and upload the ArduinoCore-zephyr core.

name: Package, test and upload core

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'tools/**' # do not run on tags created for tool releases
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.repository != 'arduino/ArduinoCore-zephyr' }}

env:
  # use the head SHA for PR hashes, instead of the merge commit
  HEAD_REF: ${{ github.event.pull_request.head.sha || github.ref }}

jobs:



  # Prepare the Zephyr build environment once for all boards, to speed up the
  # overall process and ensure all builds use the same environment and metadata.
  # Several outputs are made available for later jobs to use.

  build-env:
    name: Prepare build environment
    runs-on: ubuntu-latest
    outputs:
      # User-friendly SemVer-compatible version for the build. Matches the tag
      # name if building a tagged commit, otherwise it is "slightly more" than
      # the latest tag.
      CORE_VER: ${{ env.CORE_VER }}
      # Tag (if found) or hash identifying this core build, should be used for
      # user-friendly strings and file names
      CORE_TAG: ${{ env.CORE_TAG }}
      # Target branch referred to by this workflow (HEAD_REF for branch pushes,
      # or closest branch that contains the tag), used for ci-builds tracking
      CORE_BRANCH: ${{ env.CORE_BRANCH }}
      # Hash identifying this core build, should be used for exact version match
      CORE_HASH: ${{ env.CORE_HASH }}
      # JSON describing all boards to build, collected by get_board_details.sh
      ALL_BOARD_DATA: ${{ env.ALL_BOARD_DATA }}
      # Extended version of ALL_BOARD_DATA with link_mode alternatives added
      ALL_BOARD_FQBNS: ${{ env.ALL_BOARD_FQBNS }}
      # List of artifacts to produce, including the "zephyr" umbrella artifact
      ARTIFACTS: ${{ env.ARTIFACTS }}
      # ARTIFACTS entries with the board builds each of them requires
      PACKAGE_DATA: ${{ env.PACKAGE_DATA }}
      # List of architectures the artifacts will be built for
      SUB_ARCHES: ${{ env.SUB_ARCHES }}
      # URL of the latest ci-builds index for this branch, if any
      CI_BUILDS_URL: ${{ env.CI_BUILDS_URL }}
      # Attempt in which this job last ran: only "Re-run all jobs" runs it
      # again, so job markers from earlier attempts are no longer valid
      BUILD_ATTEMPT: ${{ github.run_attempt }}
    steps:

      - name: Install OS dependencies
        working-directory: /opt
        timeout-minutes: 5 # early error on Github network issues
        run: |
          sudo apt-get remove --purge man-db -y # skips the mandb triggers
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true # unreliable mirror
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake wget python3-pip ninja-build

      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true # needed for get_core_version.sh

      - name: Identify current version and board set
        run: |
          # Set up basic environment for later steps
          extra/ci_get_build_info.sh $HEAD_REF

      - name: Show core version
        run: |
          echo "## Building \`$CORE_VER\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache west modules and blobs
        uses: actions/cache@v5
        with:
          key: west-cache-${{ hashFiles('west.yml', 'boards.txt') }}
          restore-keys: |
            west-blobs-
          path: ${{ runner.temp }}/west-cache

      - name: Initialize Zephyr environment
        timeout-minutes: 10 # early error on Github network issues
        env:
          WEST_CACHE: ${{ runner.temp }}/west-cache
          # not needed for building, dtc is installed in the build jobs
          SDK_INSTALL_OPTS: --no-hosttools
        run: |
          # Install Zephyr as a core user would, but faster
          yes | ./extra/bootstrap.sh -o=--filter=tree:0
          # Archive the build environment for later jobs. The .git folders of
          # west projects are not needed for building: the information builds
          # take from them is recorded here instead.
          source venv/bin/activate
          # - the Zephyr build version, stored in the west configuration;
          ZEPHYR_BUILD_VERSION=$(git -C $(west list -f '{abspath}' zephyr) describe --abbrev=12 --always)
          west config build.cmake-args -- "-DBUILD_VERSION=$ZEPHYR_BUILD_VERSION"
          # - the manifests imported from other projects (Zephyr's provides its
          #   west commands and modules), which west reads from their git data:
          #   use a resolved copy of the manifest, which needs no imports;
          west manifest --resolve --active-only > west-resolved.yml
          west config manifest.file west-resolved.yml
          # - the core version, passed to the build jobs by this one.
          west list -f '{abspath}' | awk '{ print $1 "/.git" }' \
            | sed "s|^$HOME/||" > ~/build-env.exclude
          # the SDK host tools are not installed, skip their installer too
          echo "zephyr-sdk-*/hosttools" >> ~/build-env.exclude
          # Only archive the west workspace: the rest of ~/work belongs to the
          # runner (including the west cache in runner.temp).
          TOPDIR=$(realpath --relative-to=$HOME $(west topdir))
          (cd && tar cphf - --exclude-from=build-env.exclude .cmake $TOPDIR zephyr-sdk-* \
                | zstd -T0 -9 --long=27 > build-env.tar.zstd)
          ls -lh ~/build-env.tar.zstd

      - name: Archive build environment
        uses: actions/upload-artifact@v7
        with:
          name: build-env.tar.zstd
          path: ~/build-env.tar.zstd
          archive: false
          overwrite: true
          retention-days: 1



  # Extract the build environment and compile the loader project for each board
  # in parallel. The build logs and artifacts are intermediate results archived
  # for later jobs.

  build-board:
    name: Build for ${{ matrix.board }}
    runs-on: ubuntu-latest
    needs:
      - build-env
    env:
      # ccache, don't look for the spec file anywhere
      CCACHE_IGNOREOPTIONS: -specs=*
      # build-specific name of the generated artifacts
      ARTIFACT_TAG: ${{ needs.build-env.outputs.CORE_HASH }}-${{ matrix.board }}
      # the core .git folder is not archived, use the version computed by build-env
      PINNED_CORE_VERSION: ${{ needs.build-env.outputs.CORE_VER }}
      # report file stem for this board
      REPORT: reports/zephyr-${{ matrix.variant }}
    strategy:
      matrix:
        include:
          ${{ fromJSON( needs.build-env.outputs.ALL_BOARD_DATA ) }}
      fail-fast: false
    steps:

      - uses: actions/download-artifact@v8
        timeout-minutes: 10 # early error on Github network issues
        with:
          path: /home/runner
          name: build-env.tar.zstd

      - name: Restore build environment
        id: restore-env
        timeout-minutes: 5 # early error on Github network issues
        run: |
          sudo apt-get remove --purge man-db -y # skips the mandb triggers
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true # unreliable mirror
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake wget python3-pip ninja-build ccache device-tree-compiler
          (cd ~ && tar --use-compress-program=unzstd -xpf build-env.tar.zstd && rm build-env.tar.zstd)

      - name: ccache
        uses: actions/cache@v5
        with:
          key: ${{ github.job }}-${{ matrix.board }} # independent caches
          path: ~/.cache/ccache

      - name: Build loader
        shell: bash
        run: |
          # create the report directory
          mkdir -p reports
          echo "::group::ccache stats before build"
          ccache --show-stats
          echo "::endgroup::"
          # run the build, capturing stdout and stderr
          if ! ./extra/build.sh ${{ matrix.board }} 1> >(tee $REPORT.stdout) 2> >(tee $REPORT.stderr) ; then
            # build failed, capture errors in summary and stop job without artifacts
            echo "### :x: ${{ matrix.board }} (\`${{ matrix.variant }}\`) build errors" > $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat $REPORT.stderr >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # look for warnings (errors are a happy path!)
          grep -i "warning:" $REPORT.stdout > $REPORT.warnings || true

          # compute the memory usage from the linker map file
          # override the size of the Flash with the size of the loader partition
          # and add the size of the sketch partition (not reported by Zephyr)
          LOADER_SIZE=$(( $(cat variants/${{ matrix.variant }}/syms-static.ld | grep '_loader_max_size' | cut -d '=' -f 2 | tr -d ') ;') ))
          SKETCH_SIZE=$(( $(cat variants/${{ matrix.variant }}/syms-static.ld | grep '_sketch_max_size' | cut -d '=' -f 2 | tr -d ') ;') ))
          BUILD_DIR=build/${{ matrix.variant }}/zephyr
          venv/bin/python3 extra/map_memusage.py --json $REPORT.memusage \
                                  --set-max FLASH ${LOADER_SIZE} --set-max SKETCH ${SKETCH_SIZE} \
                                  $BUILD_DIR/zephyr.map $BUILD_DIR/zephyr.elf
          jq "to_entries | map([ .key + \":\", .value[0], .value[1] ]) | sort" $REPORT.memusage > $REPORT.meminfo
          rm $REPORT.memusage

          # ccache stats update
          echo "::group::ccache stats after build"
          ccache --evict-older-than 30d
          ccache --show-stats
          echo "::endgroup::"

      - name: Package board artifacts
        if: ${{ steps.restore-env.outcome == 'success' && !cancelled() }}
        run: |
          # add the config file to the report files, list them for later archiving
          cp firmwares/zephyr-${{ matrix.variant }}.config $REPORT.config
          echo "REPORT_FILES<<EOF" >> $GITHUB_ENV
          ls reports/* >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          # Preprare an archive of the built binaries (and build dir on failure).
          # Prefix the name with 'failed-' if the build failed, so that it is not removed.
          BINARIES_FILE=binaries-${ARTIFACT_TAG}.tar.zstd
          if [ "${{ job.status }}" == "failure" ] ; then
            FULL_BUILD_DIR="build/${{ matrix.variant }}/"
            BINARIES_FILE=failed-${BINARIES_FILE}
          fi
          echo "BINARIES_FILE=${BINARIES_FILE}" >> $GITHUB_ENV
          sed -e '/^#/d' boards.local.txt > boards.local_${{ matrix.variant }}.txt
          tar chf - \
            firmwares/*${{ matrix.variant }}* \
            variants/${{ matrix.variant }}/ \
            boards.local_${{ matrix.variant }}.txt \
            cores/arduino/api/ \
            ${FULL_BUILD_DIR} \
          | zstd > ${BINARIES_FILE}

      - name: Archive board binaries
        if: ${{ steps.restore-env.outcome == 'success' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARIES_FILE }}
          path: ${{ env.BINARIES_FILE }}
          archive: false
          overwrite: true
          retention-days: 7 # for failed build inspection

      - name: Archive build reports
        if: ${{ steps.restore-env.outcome == 'success' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ env.ARTIFACT_TAG }}
          path: ${{ env.REPORT_FILES }}
          overwrite: true
          retention-days: 1

      # publish the outcome of this job for the jobs that depend on it (the
      # action comes with the build environment: without it, no marker is
      # published, and the jobs depending on this one treat it as failed)
      - name: Mark build as completed
        if: ${{ !cancelled() && steps.restore-env.outcome == 'success' }}
        uses: ./.github/actions/mark-job-completed
        with:
          id: ${{ matrix.id }}
          retention-days: 1



  # Select the core packages for which all boards were built successfully.
  # Packages including a failed board are not even attempted.

  select-packages:
    name: Select packages
    runs-on: ubuntu-latest
    needs:
      - build-env
      - build-board
    if: ${{ !cancelled() && needs.build-env.result == 'success' }}
    outputs:
      # packages to create in this attempt
      PACKAGES: ${{ steps.select.outputs.PACKAGES }}
      # packages created in this attempt or already in an earlier one
      READY_PACKAGES: ${{ steps.select.outputs.READY_PACKAGES }}
    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            extra/ci_filter_matrix.sh
          sparse-checkout-cone-mode: false

      # build markers, and package markers of earlier attempts
      - uses: actions/download-artifact@v8
        continue-on-error: true # nothing to download if all builds failed
        with:
          path: prereqs/
          pattern: prereq-*
          merge-multiple: true

      - name: Select packages
        id: select
        env:
          PACKAGE_DATA: ${{ needs.build-env.outputs.PACKAGE_DATA }}
          MIN_ATTEMPT: ${{ needs.build-env.outputs.BUILD_ATTEMPT }}
        run: |
          echo "PACKAGES=$(extra/ci_filter_matrix.sh -m $MIN_ATTEMPT prereqs/ "$PACKAGE_DATA")" >> $GITHUB_OUTPUT
          echo "READY_PACKAGES=$(extra/ci_filter_matrix.sh -a -m $MIN_ATTEMPT prereqs/ "$PACKAGE_DATA" 2>/dev/null)" >> $GITHUB_OUTPUT



  # Compose the core packages for each architecture in parallel, by retrieving
  # the API snapshot and the built binaries for all boards and packaging them.
  # The resulting core packages are final artifacts, ready for publishing.
  # The 'zephyr' umbrella package is also created here by including all others.

  package-core:
    name: Package ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    needs:
      - build-env
      - select-packages
    env:
      ALL_BOARD_DATA: ${{ needs.build-env.outputs.ALL_BOARD_DATA }}
      CORE_ARTIFACT: ArduinoCore-${{ matrix.artifact }}-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2
      CORE_TAG: ${{ needs.build-env.outputs.CORE_TAG }}
    strategy:
      matrix:
        include:
          ${{ fromJSON( needs.select-packages.outputs.PACKAGES ) }}
      fail-fast: false
    if: ${{ !cancelled() && needs.select-packages.result == 'success' && needs.select-packages.outputs.PACKAGES != '[]' }}
    steps:

      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      # Get all built binaries
      - uses: actions/download-artifact@v8
        with:
          path: .
          pattern: binaries-*
          merge-multiple: true

      - name: Package core
        run: |
          # Extract the board binaries in place
          # (each will also include the same copy of the API)
          for f in binaries-*.tar.zstd ; do
            tar --use-compress-program=unzstd -xpf $f
          done
          cat $(ls boards.local_*.txt | sort) >> boards.local.txt
          # Create the core artifact for this set of boards
          ./extra/package_core.sh ${{ matrix.artifact }} ${CORE_TAG} distrib/${CORE_ARTIFACT}

      - uses: actions/upload-artifact@v7
        id: upload-core
        if: ${{ success() || failure() }}
        with:
          name: ${{ env.CORE_ARTIFACT }}
          path: distrib/${{ env.CORE_ARTIFACT }}
          archive: false
          overwrite: true

      - name: Archive artifact ID
        run: |
          echo '${{ steps.upload-core.outputs.artifact-id }}' > ${{ matrix.artifact }}.id

      - uses: actions/upload-artifact@v7
        with:
          name: artifact-id-${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.id
          overwrite: true

      # publish the outcome of this job for the jobs that depend on it
      - name: Mark package as completed
        if: ${{ !cancelled() }}
        uses: ./.github/actions/mark-job-completed
        with:
          id: ${{ matrix.id }}
          retention-days: 1



  # Prepare this PR's temporary package index JSON by merging the newly
  # built core packages with the latest package index from ci-builds.

  package-index:
    name: Package index URL for offline tests
    runs-on: ubuntu-latest
    needs:
      - build-env
      - select-packages
      - package-core
    # package-core is skipped if all packages were already created in an earlier attempt
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build-env.outputs.CI_BUILDS_URL != '' && needs.select-packages.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.package-core.result) }}
    env:
      CORE_HASH: ${{ needs.build-env.outputs.CORE_HASH }}
      CORE_BRANCH: ${{ needs.build-env.outputs.CORE_BRANCH }}
      PACKAGES: ${{ needs.select-packages.outputs.READY_PACKAGES }}
      CI_BUILDS_URL: ${{ needs.build-env.outputs.CI_BUILDS_URL }}
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          pattern: ArduinoCore-*.tar.bz2
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: artifact-id-*
          path: .
          merge-multiple: true

      - name: Prepare PR package index
        run: |
          wget ${CI_BUILDS_URL} -O ci_index.json
          # clear other platforms from the index
          jq '.packages[0].platforms = []' ci_index.json > ci_index.tmp && mv ci_index.tmp ci_index.json

          mkdir -p snippets/platforms/
          jq -cr '.[].artifact' <<< ${PACKAGES} | while read -r artifact; do
            [ $artifact == "zephyr" ] && continue
            ARTIFACT_FILE=ArduinoCore-${artifact}-${CORE_HASH}.tar.bz2
            PACKAGE_JSON=snippets/platforms/${artifact}.json
            ./extra/gen_package_index_json.sh ${artifact} ${ARTIFACT_FILE} ${PACKAGE_JSON}
            # replace the download URL with this PR's artifact link
            ARTIFACT_ID=$(cat ${artifact}.id)
            ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
            sed -i -e "s!\"url\":.*!\"url\": \"${ARTIFACT_URL}\",!" ${PACKAGE_JSON}
            # append the new snippet to the index
            jq -s '.[0].packages[0].platforms += .[1].packages[0].platforms | .[0]' \
                    ci_index.json ${PACKAGE_JSON} > ci_index.tmp && mv ci_index.tmp ci_index.json
          done
          PACKAGE_INDEX_FILE="package_arduino_zephyr_pr_${{ github.event.pull_request.number }}_ci_index.json"
          echo "PACKAGE_INDEX_FILE=${PACKAGE_INDEX_FILE}" >> $GITHUB_ENV
          mv ci_index.json ${PACKAGE_INDEX_FILE}

      - name: Archive PR package index
        id: package-index-json
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_INDEX_FILE }}
          path: ${{ env.PACKAGE_INDEX_FILE }}
          archive: false
          overwrite: true

      - name: Display final URL in the summary
        run: |
          ARTIFACT_ID=${{ steps.package-index-json.outputs.artifact-id }}
          PACKAGE_INDEX_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
          PACKAGE_INDEX_URL="${PACKAGE_INDEX_URL}#${{ env.PACKAGE_INDEX_FILE }}"
          echo "[${PACKAGE_INDEX_URL}](${PACKAGE_INDEX_URL})" >> $GITHUB_STEP_SUMMARY



  # After generating the final cores, the following temporary artifacts are
  # no longer used and can be removed:
  #
  #  - the Zephyr build environment
  #  - the API and per-board binaries
  #  - the artifact download URLs

  cleanup-build:
    name: Clean up intermediates
    runs-on: ubuntu-latest
    needs:
      - build-board
      - package-core
      - package-index
    # package-index only runs on PRs, do not skip cleanup when it is skipped;
    # keep everything if any board failed, as it is needed to re-run that build
    if: ${{ !cancelled() && needs.build-board.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.package-core.result) }}
    steps:

      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            arduino-api.tar.zstd
            binaries-*
            build-env.tar.zstd
            artifact-id-*
          failOnError: false



  # Test the just built core packages, see test_core.yml for details.

  test-core:
    name: Test
    needs:
      - build-env
      - package-core
    if: ${{ !cancelled() && needs.build-env.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test_core.yml
    with:
      core-run-id: ${{ github.run_id }}
      core-version: ${{ needs.build-env.outputs.CORE_VER }}
      min-attempt: ${{ needs.build-env.outputs.BUILD_ATTEMPT }}



  # Collect all build and test reports, analyze them and produce a summary.
  # See ci_collect_data.py and ci_generate_report.py for details.

  verify-core:
    runs-on: ubuntu-latest
    needs:
      - build-env
      - package-core
      - test-core
    if: ${{ !cancelled() }}
    env:
      ALL_BOARD_DATA: ${{ needs.build-env.outputs.ALL_BOARD_DATA }}
      CORE_VER: ${{ needs.build-env.outputs.CORE_VER }}
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          path: .
          pattern: "*-report-*"
          merge-multiple: true

      # job completion markers, with the links to each job log
      - uses: actions/download-artifact@v8
        continue-on-error: true # links are optional
        with:
          path: prereqs/
          pattern: prereq-*
          merge-multiple: true

      - name: Generate workflow summary
        run: |
          # Archive the input set of reports for later inspection
          tar jchf build-reports-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2 zephyr-* arduino-*.json
          # Collect all CI data into a JSON file, then generate the report
          extra/ci_collect_data.py build_info.json
          extra/ci_generate_report.py build_info.json result summary full_log
          cat result

          # Display the summary and full log in the step summary
          cat summary >> $GITHUB_STEP_SUMMARY
          cat full_log >> $GITHUB_STEP_SUMMARY

          # Create a comment for PRs using the summary file
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            mkdir -p comment-request
            echo "${{ github.event.pull_request.number }}" > comment-request/pr_number
            echo -e "## Built \`$CORE_VER\`\n" > comment-request/comment_body
            # strip LaTeX color commands and escape sequences for mail readability
            cat summary | sed -e 's!\${\\color{\S*}\(.*\)}\$!\1!g' -e 's!\\%!%!g' >> comment-request/comment_body
          fi

          # Prepare latest size artifact file on push events
          if [ "${{ github.event_name }}" == "push" ]; then
            tar jchf size-reports-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2 arduino-*.json
          fi

      - name: Compute code size changes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          export GITHUB_BASE_SHA=$(git rev-list --parents -n 1 HEAD | cut -d' ' -f2)
          # errors due to race conditions with parallel branch runs should not fail the job
          extra/ci_calc_size_reports.py ${GITHUB_BASE_SHA} sketches-reports/ || true

      # upload build metadata artifact, for upload to ci-builds
      - name: Archive build metadata information
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          path: build_info.json
          overwrite: true
          retention-days: 1

      # upload comment request artifact (will be retrieved by leave_pr_comment.yml)
      - name: Archive comment information
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: comment-request
          path: comment-request/
          overwrite: true
          retention-days: 1

      # upload size delta report artifact (will be retrieved by report_size_deltas.yml)
      - name: Archive size deltas report information
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: sketches-reports
          path: sketches-reports/
          overwrite: true
          retention-days: 1

      # upload new official test size artifact (for AWS storage)
      - name: Archive sketch size information
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' }}
        with:
          name: size-reports-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2
          path: size-reports-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2
          archive: false
          overwrite: true
          retention-days: 1

      # upload input set of build reports artifact (for CI debugging)
      - name: Archive input test reports
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2
          path: build-reports-${{ needs.build-env.outputs.CORE_HASH }}.tar.bz2
          archive: false
          overwrite: true
          retention-days: 1

      # The last line makes the job fail if the 'result' file does not contain "PASSED".
      # No further actions are allowed in case of error.
      - run: |
          cat result
          grep -q "PASSED" result # otherwise CI test failed



  # Clean up test results only if the verification actually passed, so that
  # they are still available for action re-runs in case of failure.

  clean-temps:
    name: Clean up test results
    runs-on: ubuntu-latest
    if: ${{ needs.verify-core.result == 'success' }}
    needs:
      - build-env
      - package-core
      - verify-core

    steps:

      - name: Clean up intermediate artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            build-report-*
            test-report-*
            prereq-build-*
            prereq-package-*
            prereq-test-*
          failOnError: false



  # Upload the built core packages to the S3 bucket for public distribution.

  publish-core:
    name: Publish core
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository == 'arduino/ArduinoCore-zephyr' && !startsWith(github.ref_name, 'dependabot/') }}
    needs:
      - build-env
      - package-core
      - verify-core
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:

      - uses: actions/download-artifact@v8
        with:
          path: .
          pattern: ArduinoCore-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: .
          pattern: size-reports-*.tar.bz2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifact
        run: |
          for f in ArduinoCore-*.tar.bz2 ; do
            aws s3 cp $f s3://${{ secrets.S3_BUCKET }}/
          done
          aws s3 cp size-reports-*.tar.bz2 s3://${{ secrets.S3_BUCKET }}/size-reports/



  # Prepare the package index JSON snippets for the newly built core packages.

  prepare-json:
    name: Prepare jsons
    runs-on: ubuntu-latest
    needs:
      - build-env
      - package-core
      - verify-core
    env:
      CORE_TAG: ${{ needs.build-env.outputs.CORE_TAG }}
      CORE_HASH: ${{ needs.build-env.outputs.CORE_HASH }}
      ARTIFACTS: ${{ needs.build-env.outputs.ARTIFACTS }}
    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          pattern: ArduinoCore-*.tar.bz2
          path: .
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: build-metadata
          path: snippets/metadata/

      - name: Prepare package index snippets
        run: |
          mkdir -p snippets/platforms/
          jq -cr '.[]' <<< ${ARTIFACTS} | while read -r artifact; do
            # note: the archive names are always hash-based so they use a
            # predictable pattern. JSON files can use the tag for user-friendliness.
            ARTIFACT_FILE=ArduinoCore-${artifact}-${CORE_HASH}.tar.bz2
            PACKAGE_JSON=snippets/platforms/ArduinoCore-${artifact}-${CORE_TAG}.json
            ./extra/gen_package_index_json.sh ${artifact} ${ARTIFACT_FILE} ${PACKAGE_JSON}
          done

      - name: Archive package index snippets
        uses: actions/upload-artifact@v7
        with:
          name: snippets-${{ env.CORE_TAG }}
          path: snippets/
          overwrite: true



  # Upload the newly built core packages and package index snippets to the
  # ci-builds repository so the build is fully logged and the next PRs can
  # use them as a reference for testing.

  ci-builds-upload:
    name: Upload to ci-builds
    if: ${{ github.event_name == 'push' && github.repository == 'arduino/ArduinoCore-zephyr' && !startsWith(github.ref_name, 'dependabot/') }}
    runs-on: ubuntu-latest
    needs:
      - build-env
      - verify-core
      - prepare-json
    permissions:
      id-token: write   # required to obtain the OIDC token
    steps:
      # Run the composite action in this context to create a proper OIDC token
      # for this repo and start the internal workflows.
      - uses: arduino/core-ci-builds@main
        with:
          token: ${{ secrets.CI_BUILDS_TOKEN }}
          version: ${{ needs.build-env.outputs.CORE_VER }}
          artifact: snippets-${{ needs.build-env.outputs.CORE_TAG }}
          base-branch: ${{ needs.build-env.outputs.CORE_BRANCH }}
