# NOTE: This is created to be used for CI/CD workflow. So use it only
# if you are in the zephyrproject directory or else things may break.

manifest:
  self:
    path: modules/lib/ArduinoCore-zephyr

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: arduino
      url-base: https://github.com/arduino
    - name: facchinm
      url-base: https://github.com/facchinm
    - name: pillo79
      url-base: https://github.com/pillo79
    - name: gibix
      url-base: https://github.com/gibix
    - name: dani-clo
      url-base: https://github.com/dani-clo

  projects:
    - name: zephyr
      remote: dani-clo
      revision: nano-chandler-tmp
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - littlefs
          - tinycrypt
          - mbedtls
          - tf-psa-crypto
          - segger
          - thrift
          - nanopb
          - lvgl
          - fatfs
          - zcbor
        path-allowlist:
          - modules/hal/*

        # The actual list of enabled HALs is set by extra/bootstrap.sh via
        # the 'manifest.project-filter' config. Enable all Zephyr HALs with:
        #
        #   west config -d manifest.project-filter

    - name: cannectivity
      path: modules/lib/cannectivity
      url: https://github.com/CANnectivity/cannectivity.git
      # Pinned to a known-good commit to avoid breakage from upstream `main`.
      # This is the latest cannectivity commit as of the last successful CI
      # build (run 29030899790, 2026-07-09), before the July USB device_next
      # API changes broke the build. Update this SHA once a newer commit is
      # verified against the Zephyr revision above.
      revision: cf24edd66ab173d20f734e3f3350b1a1c053a904
    - name: mcuboot
      remote: gibix
      revision: 935b7db028c6e17a6fabe6ef0dda3e2dbc4a0bdd
      path: bootloader/mcuboot

    - name: hal_microchip
      revision: master
      url: https://github.com/Zephyr4Microchip/microchip-hal
      path: modules/hal/microchip
      groups:
        - hal
